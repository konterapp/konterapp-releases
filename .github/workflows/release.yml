name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: KonterApp Offline ${{ github.ref_name }}
          make_latest: true
          body: |
            Windows 10/11 64-bit: KonterApp-Setup-<versi>.exe
            Android 7.0+: KonterApp-<versi>.apk (semua HP) atau APK per arsitektur (lebih kecil).
          files: assets/*
